<!doctype html>
<html lang="sq">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0b0d" />

    <!-- Title carries the project, the offer and the place, in that order:
         it is what shows in the tab, in search results and in a shared link,
         and it gets truncated around 60 characters. -->
    <title>Golden Hands 4 — Apartamente dhe njësi tregtare në qendër</title>
    <meta
      name="description"
      content="42 apartamente dhe 6 njësi tregtare në cep të një kryqëzimi në qendër të qytetit. Përfundim 2026. Shfletoni ndërtesën në modelin 3D të projektit."
    />
    <link rel="canonical" href="__CANONICAL__" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__SITE_NAME__" />
    <meta property="og:locale" content="__LOCALE__" />
    <meta property="og:title" content="Golden Hands 4 — Apartamente dhe njësi tregtare në qendër" />
    <meta
      property="og:description"
      content="Shtatë kate banimi mbi një përdhesë tregtare, në cep të një kryqëzimi. Shfletoni ndërtesën në modelin 3D të projektit."
    />
    <meta property="og:url" content="__CANONICAL__" />
    <meta property="og:image" content="__OG_IMAGE__" />
    <meta property="og:image:width" content="__OG_W__" />
    <meta property="og:image:height" content="__OG_H__" />
    <meta property="og:image:alt" content="Pamje tredimensionale e ndërtesës Golden Hands 4 nga cepi i kryqëzimit." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Golden Hands 4 — Apartamente dhe njësi tregtare në qendër" />
    <meta
      name="twitter:description"
      content="Shtatë kate banimi mbi një përdhesë tregtare. Shfletoni ndërtesën në modelin 3D të projektit."
    />
    <meta name="twitter:image" content="__OG_IMAGE__" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/logo.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Playfair Display carries the headings, Inter everything else. Both
         cover Albanian's ë and ç, which rules out a good half of the
         display faces that would otherwise suit the brand. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap"
      rel="stylesheet"
    />

    <!-- Nothing renders until the model is fetched AND decoded, and the
         decoder is a separate request the loader only makes once the JS
         has run. Both start here instead, in parallel with the bundle. -->
    <link
      rel="preload"
      href="/models/GoldenHands3d_Building.glb"
      as="fetch"
      type="model/gltf-binary"
      crossorigin
    />
    <link rel="preload" href="/draco/draco_wasm_wrapper.js" as="script" />
    <link rel="preload" href="/draco/draco_decoder.wasm" as="fetch" crossorigin />

    <!-- Tells search engines what this actually is: a building being sold by
         a named company, not a generic page. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "__SITE_URL__/#organization",
            "name": "Golden Hands Construction",
            "url": "__SITE_URL__/",
            "logo": "__SITE_URL__/brand/logo.png",
            "email": "info@goldenhands.al"
          },
          {
            "@type": "WebSite",
            "@id": "__SITE_URL__/#website",
            "url": "__SITE_URL__/",
            "name": "Golden Hands 4",
            "inLanguage": "sq",
            "publisher": { "@id": "__SITE_URL__/#organization" }
          },
          {
            "@type": "ApartmentComplex",
            "name": "Golden Hands 4",
            "url": "__SITE_URL__/",
            "description": "Shtatë kate banimi mbi një përdhesë tregtare, në cep të një kryqëzimi në qendër të qytetit.",
            "image": "__OG_IMAGE__",
            "numberOfAccommodationUnits": 42,
            "numberOfFloors": 7,
            "provider": { "@id": "__SITE_URL__/#organization" }
          }
        ]
      }
    </script>
  </head>

  <body>
    <a class="skip" href="#kontakt">Kalo te kontakti</a>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <noscript>
      <div class="noscript">
        <h1>Golden Hands 4</h1>
        <p>
          Kjo faqe e paraqet ndërtesën në një model tredimensional, i cili
          kërkon JavaScript. Aktivizojeni në shfletuesin tuaj, ose shihni
          informacionin e projektit në faqet e mëposhtme.
        </p>
        <p>
          <a href="/pyetje/">Pyetje të shpeshta</a> ·
          <a href="mailto:info@goldenhands.al">info@goldenhands.al</a>
        </p>
      </div>
    </noscript>
  </body>
</html>
