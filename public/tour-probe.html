<!doctype html>
<meta charset="utf-8"><title>Tour preload probe</title>
<style>
 body{font:13px/1.6 ui-monospace,Consolas,monospace;background:#0d0f12;color:#f4f1ea;padding:24px}
 h1{font-size:14px;color:#c8a24a;letter-spacing:.2em;text-transform:uppercase}
 #log{white-space:pre-wrap;margin-top:14px}
 .k{color:#e8c877}.w{color:#ff9d5c}.g{color:#7ddb8a}
 button{margin-right:8px;padding:8px 14px;background:#1a1d22;color:#e8c877;
   border:1px solid #c8a24a55;cursor:pointer;font:inherit}
</style>
<h1>Coohom preload probe</h1>
<p>Open DevTools → Network, then watch the log. This mounts the tour exactly
   the way the app does and reports every observable signal.</p>
<button id="go">Start warm-up</button>
<button id="show">Show it (simulate click)</button>
<div id="log"></div>
<script type="module">
const URL_ = 'https://www.coohom.com/pub/modelo/viewer/preview/3FO3CYS0MSC1';
const log = document.getElementById('log');
const t0 = performance.now();
const say = (m, c='') => {
  const dt = ((performance.now()-t0)/1000).toFixed(2).padStart(6);
  log.innerHTML += `<span class="k">[${dt}s]</span> <span class="${c}">${m}</span>\n`;
};

let host, frame;
document.getElementById('go').onclick = () => {
  if (host) return say('already warming', 'w');
  host = document.createElement('div');
  host.style.cssText =
    'position:fixed;left:-12000px;top:0;width:1280px;height:800px;z-index:-1;clip-path:inset(50%)';
  document.body.appendChild(host);

  frame = document.createElement('iframe');
  frame.src = URL_;
  frame.style.cssText = 'width:100%;height:100%;border:0';
  frame.allowFullscreen = true;
  frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-popups allow-forms');
  frame.setAttribute('loading','eager');
  frame.addEventListener('load', () => {
    say('iframe LOAD fired (page arrived)', 'g');
    probeInside();
  });
  frame.addEventListener('error', () => say('iframe ERROR', 'w'));
  host.appendChild(frame);
  say('warm-up started, iframe attached offscreen');
};

// Can we see inside? sandbox has allow-same-origin but the origin differs,
// so this should throw — worth proving rather than assuming.
function probeInside() {
  try {
    const d = frame.contentDocument;
    say(d ? 'contentDocument READABLE (same-origin!)' : 'contentDocument null', d?'g':'w');
    if (d) say('  inner readyState: ' + d.readyState);
  } catch (e) {
    say('contentDocument blocked: ' + e.name + ' (cross-origin, as expected)', 'w');
  }
  // Resource timing DOES cross the boundary for the frame's own subresources
  // only if Timing-Allow-Origin permits; count what we can see.
  setTimeout(reportTiming, 2000);
  setTimeout(reportTiming, 8000);
  setTimeout(reportTiming, 16000);
}

function reportTiming() {
  const es = performance.getEntriesByType('resource')
    .filter(e => e.name.includes('coohom'));
  const bytes = es.reduce((n,e)=>n+(e.transferSize||0),0);
  say(`resource entries visible for coohom: ${es.length}, transferred ≈ ${(bytes/1048576).toFixed(2)} MB`);
}

document.getElementById('show').onclick = () => {
  if (!frame) return say('nothing warming yet', 'w');
  host.style.cssText = 'position:fixed;inset:80px 24px 24px;z-index:5';
  say('moved on screen — is the model already rendered?', 'g');
};
</script>
